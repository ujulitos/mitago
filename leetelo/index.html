<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <title>Léetelo</title>

    <!-- PWA & Mobile WebApp Tags -->
    <link rel="manifest" href="app.webmanifest">
    <meta name="theme-color" content="#17181b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Léetelo">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/jpeg" href="icons/libro.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Local self-hosted fonts for 100% offline reading -->
    <link rel="stylesheet" href="src/lib/fonts.css">

    <!-- Core styles -->
    <script src="src/lib/theme-boot.js"></script>
    <link rel="stylesheet" href="src/lib/base.css">
    <link rel="stylesheet" href="src/reader/reader.css">
    <script type="module" src="src/reader/reader.js"></script>
</head>

<body>
    <!-- App startup splash screen -->
    <div id="splash-screen" class="splash-screen" aria-hidden="true">
        <div class="splash-inner">
            <img class="splash-logo" src="icons/libro.jpg" alt="" width="84" height="84">
            <div class="splash-title">Léetelo</div>
            <span class="splash-spinner" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                    <circle class="loading-track" cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2.4" />
                    <path class="loading-arc" d="M21.5 12a9.5 9.5 0 0 0-9.5-9.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                </svg>
            </span>
        </div>
    </div>

    <input id="file" type="file" accept=".epub,application/epub+zip,.fb2,.fbz,.fb2.zip,.zip,.cbz" multiple class="visually-hidden" tabindex="-1" aria-hidden="true">

    <!-- ============================================================ library -->
    <div id="library" class="library" hidden>
        <header class="lib-head">
            <div class="lib-head-inner">
                <div class="lib-brand-row">
                    <button id="lib-menu-btn" class="icon-btn lib-menu-btn" type="button" aria-controls="lib-drawer" aria-expanded="false" data-i18n-aria="menu" data-i18n-title="menu">
                        <span class="burger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
                    </button>
                    <h1 class="brand" id="brand"><span>Léetelo</span></h1>
                </div>
                <div class="lib-tools">
                    <div id="shelf-search-wrap" class="shelf-search-bar" role="search">
                        <span id="shelf-search-icon" class="shelf-search-icon" aria-hidden="true"></span>
                        <input id="shelf-search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="shelf_search_placeholder" data-i18n-aria="shelf_search_placeholder">
                        <button id="shelf-search-clear" class="icon-btn shelf-search-clear" type="button" data-i18n-aria="dismiss" data-i18n-title="dismiss" hidden></button>
                    </div>
                </div>
            </div>
        </header>

        <main class="lib-main">
            <div id="notice" class="notice" role="alert" hidden>
                <span class="notice-icon" id="notice-icon" aria-hidden="true"></span>
                <div class="notice-text">
                    <p class="notice-title" id="notice-title"></p>
                    <p class="notice-next" id="notice-next"></p>
                </div>
                <button id="notice-close" class="icon-btn" type="button" data-i18n-aria="dismiss" data-i18n-title="dismiss"></button>
            </div>

            <section id="whats-new" class="quiet-card whats-new" aria-labelledby="wn-title" hidden>
                <span class="lead" id="wn-icon" aria-hidden="true"></span>
                <div>
                    <h3 id="wn-title" data-i18n="wn_title"></h3>
                    <ul class="wn-list">
                        <li data-i18n="wn_highlights"></li>
                        <li data-i18n="wn_spread"></li>
                        <li data-i18n="wn_formats"></li>
                        <li data-i18n="wn_book_settings"></li>
                        <li data-i18n="wn_stats"></li>
                        <li data-i18n="wn_library_file"></li>
                        <li data-i18n="wn_keys"></li>
                    </ul>
                    <button id="wn-ok" class="tool strong" type="button" data-i18n="wn_ok"></button>
                </div>
                <button id="wn-close" class="icon-btn close" type="button" data-i18n-aria="dismiss" data-i18n-title="dismiss"></button>
            </section>

            <section id="first-run" class="dropzone" aria-labelledby="drop-title" hidden>
                <div class="drop-art" id="drop-art" aria-hidden="true"></div>
                <h2 id="drop-title" data-i18n="drop_title"></h2>
                <p class="drop-sub" data-i18n="drop_sub"></p>
            </section>


            <section id="shelf" aria-labelledby="shelf-title" hidden>
                <div class="shelf-head">
                    <h2 id="shelf-title" data-i18n="your_books"></h2>
                    <span id="shelf-count" class="muted"></span>
                </div>
                <div id="shelf-sections" class="shelf-sections">
                    <ul id="books" class="books"></ul>
                </div>
            </section>

            <div id="cards" class="cards">
                <section id="tier2" class="quiet-card" aria-labelledby="tier2-title" hidden>
                    <span class="lead" id="tier2-icon" aria-hidden="true"></span>
                    <div>
                        <h3 id="tier2-title" data-i18n="tier2_title"></h3>
                        <p id="tier2-body"></p>
                        <div class="copy-row">
                            <code id="tier2-link"></code>
                            <button id="tier2-copy" class="tool strong" type="button" data-i18n="copy_link"></button>
                        </div>
                    </div>
                    <button id="tier2-close" class="icon-btn close" type="button" data-i18n-aria="dismiss" data-i18n-title="dismiss"></button>
                </section>
            </div>

            <!-- Synopsis / Metadata Modal -->
            <div id="meta-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="meta-modal-heading" hidden>
                <div class="modal-backdrop" id="meta-modal-backdrop"></div>
                <div class="modal-card">
                    <header class="modal-header">
                        <h3 id="meta-modal-heading" data-i18n="synopsis_title">Sinopsis</h3>
                        <button id="meta-modal-close" class="icon-btn modal-close" type="button" data-i18n-aria="close" data-i18n-title="close"></button>
                    </header>
                    <div class="modal-body" id="meta-modal-body"></div>
                </div>
            </div>
        </main>

        <!-- Hamburger Menu Drawer -->
        <div id="lib-drawer" class="lib-drawer" role="dialog" aria-modal="true" aria-labelledby="lib-drawer-title" hidden>
            <div class="lib-drawer-backdrop" id="lib-drawer-backdrop"></div>
            <aside class="lib-drawer-panel">
                <header class="lib-drawer-head">
                    <button id="lib-drawer-close" class="icon-btn lib-menu-btn lib-drawer-close" type="button" data-i18n-aria="dismiss" data-i18n-title="dismiss">
                        <span class="burger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
                    </button>
                    <h2 id="lib-drawer-title" data-i18n="menu">Menú</h2>
                </header>
                <div class="lib-drawer-body">
                    <div class="lib-theme-dropdown" id="lib-theme-dropdown">
                        <button id="lib-theme-toggle" class="lib-theme-toggle" type="button" aria-haspopup="true" aria-expanded="false">
                            <span id="lib-theme-label" class="lib-theme-label" data-i18n="theme">Tema</span>
                            <span id="lib-theme-chevron" class="lib-theme-chevron" aria-hidden="true"></span>
                        </button>
                        <div class="swatches" role="radiogroup" aria-labelledby="lbl-theme" id="lib-theme"></div>
                    </div>

                    <button id="lib-drawer-add" class="lib-drawer-action" type="button">
                        <span class="lib-drawer-action-icon" id="lib-drawer-add-icon" aria-hidden="true"></span>
                        <span class="lib-drawer-action-text">
                            <strong data-i18n="add_books">Agregar libro(s)</strong>
                            <small data-i18n="add_books_sub">Arrastra aquí o toca · EPUB, FB2 o CBZ</small>
                        </span>
                    </button>

                    <section id="stats" class="stats lib-drawer-section" aria-labelledby="stats-title">
                        <h3 id="stats-title" class="lib-drawer-section-title" data-i18n="stats_title"></h3>
                        <dl id="stats-list" class="stats-list"></dl>
                    </section>

                    <section id="lib-info" class="lib-drawer-section" aria-labelledby="lib-info-title">
                        <h3 id="lib-info-title" class="lib-drawer-section-title" data-i18n="library_info">Información de la biblioteca</h3>
                        <dl class="lib-info-list">
                            <div>
                                <dt data-i18n="total_books_label">Libros en la biblioteca</dt>
                                <dd id="lib-info-books">0</dd>
                            </div>
                            <div>
                                <dt data-i18n="storage_label">Espacio ocupado</dt>
                                <dd id="storage">—</dd>
                            </div>
                            <div>
                                <dt data-i18n="version_label">Versión</dt>
                                <dd id="app-version">1.00</dd>
                            </div>
                        </dl>
                    </section>
                </div>
            </aside>
        </div>

        <!-- Batch selection bar for Todos -->
        <div id="batch-bar" class="batch-bar" role="region" aria-live="polite" hidden>
            <div class="batch-bar-inner">
                <div class="batch-bar-main" id="batch-bar-main">
                    <button id="batch-cancel" class="icon-btn batch-close" type="button" data-i18n-aria="cancel" data-i18n-title="cancel"></button>
                    <span id="batch-count" class="batch-count"></span>
                    <div class="batch-bar-actions">
                        <button id="batch-select-all" class="batch-btn" type="button" data-i18n="select_all">Seleccionar todos</button>
                        <button id="batch-delete" class="batch-btn batch-delete" type="button"></button>
                    </div>
                </div>
                <div class="batch-confirm" id="batch-confirm" hidden>
                    <span id="batch-confirm-text" class="batch-confirm-text"></span>
                    <div class="batch-bar-actions">
                        <button id="batch-confirm-keep" class="batch-btn" type="button" data-i18n="keep">Conservar</button>
                        <button id="batch-confirm-yes" class="batch-btn batch-delete" type="button" data-i18n="delete">Eliminar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Touch/pointer interactive right-side scroll rail for mobile Home -->
        <div id="lib-scrollbar" class="lib-scrollbar" aria-hidden="true" hidden>
            <div id="lib-scrollbar-track" class="lib-scrollbar-track">
                <div id="lib-scrollbar-thumb" class="lib-scrollbar-thumb"></div>
            </div>
        </div>
    </div>

    <!-- ============================================================ reading -->
    <div id="reading" class="reading" hidden>
        <header id="bar" class="bar">
            <div class="bar-controls">
                <button id="back" class="icon-btn" type="button" data-i18n-aria="back_to_library" data-i18n-title="back_to_library"></button>
                <div class="bar-tools">
                    <button id="btn-toc" class="icon-btn" type="button" aria-controls="panel" aria-expanded="false"></button>
                    <button id="btn-search" class="icon-btn" type="button" aria-controls="panel" aria-expanded="false"></button>
                    <button id="btn-marks" class="icon-btn" type="button" aria-controls="panel" aria-expanded="false"></button>
                    <button id="btn-hl" class="icon-btn" type="button" aria-controls="panel" aria-expanded="false"></button>
                    <button id="btn-settings" class="icon-btn" type="button" aria-controls="panel" aria-expanded="false"></button>
                </div>
            </div>
            <div class="bar-title">
                <span id="book-title" class="book-title"></span>
                <span id="chapter" class="chapter"></span>
                <span id="chapter-pages" class="chapter-pages"></span>
            </div>
        </header>
        <div id="bar-margin" class="bar-margin" aria-hidden="true"></div>
        <button id="quick-theme" class="corner-btn corner-theme" type="button"></button>
        <button id="quick-bookmark" class="corner-btn corner-bookmark" type="button" aria-pressed="false"></button>

        <main id="view" tabindex="-1"></main>

        <!-- Highlight toolbar -->
        <div id="hl-bar" class="hl-bar" role="toolbar" data-i18n-aria="hl_toolbar" hidden>
            <div id="hl-colors" class="hl-colors"></div>
            <button id="hl-note-btn" class="tool" type="button" aria-controls="hl-note-form" aria-expanded="false"></button>
            <button id="hl-delete" class="icon-btn" type="button" hidden></button>
            <form id="hl-note-form" class="hl-note" hidden>
                <textarea id="hl-note" rows="3" data-i18n-aria="hl_note" data-i18n-placeholder="hl_note_placeholder"></textarea>
                <div class="hl-note-actions">
                    <button id="hl-note-cancel" class="tool" type="button" data-i18n="hl_cancel"></button>
                    <button id="hl-note-save" class="tool strong" type="submit" data-i18n="hl_save"></button>
                </div>
            </form>
        </div>

        <button id="page-prev" class="page-btn prev" type="button" hidden></button>
        <button id="page-next" class="page-btn next" type="button" hidden></button>

        <footer id="reading-foot" class="reading-foot">
            <div id="foot-margin" class="foot-margin" aria-hidden="true"></div>
            <div id="rail" class="rail" role="slider" tabindex="0" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="rail-track" id="rail-track">
                    <div class="rail-fill" id="rail-fill"></div>
                    <div id="ticks" class="ticks"></div>
                    <div class="rail-thumb" id="rail-thumb"></div>
                </div>
                <div class="rail-tip" id="rail-tip" hidden></div>
            </div>
            <div class="reading-foot-row">
                <div class="reading-foot-left">
                    <div id="clock-widget" class="clock-widget">
                        <div id="analog-clock" class="analog-clock" role="img" aria-label="Reloj analógico" title="Reloj">
                            <svg viewBox="0 0 176 176" width="100%" height="100%" class="clock-svg">
                                <circle class="clock-dial" cx="88" cy="88" r="82" />
                                <line id="clock-hour" class="clock-hand clock-hour" x1="88" y1="88" x2="88" y2="44" stroke-linecap="round" />
                                <line id="clock-min" class="clock-hand clock-min" x1="88" y1="88" x2="88" y2="20" stroke-linecap="round" />
                                <circle class="clock-pivot" cx="88" cy="88" r="7" />
                            </svg>
                        </div>
                        <div id="clock-segmented" class="segmented clock-segmented">
                            <button id="clock-bar-toggle" class="clock-bar-toggle" type="button" role="switch" aria-checked="true" aria-label="Reloj" title="Reloj">
                                <span id="clock-bar-label" class="clock-bar-label" data-i18n="clock">Reloj</span>
                            </button>
                        </div>
                    </div>
                    <div id="chapter-time" class="chapter-time" aria-hidden="true"></div>
                </div>
                <div id="folio" class="folio" hidden></div>
                <div class="reading-foot-right">
                    <div id="pct" class="pct" aria-hidden="true"></div>
                </div>
            </div>
            <div id="book-bar" class="book-bar" aria-hidden="true">
                <div id="book-fill" class="book-fill"></div>
            </div>
        </footer>

        <aside id="panel" class="panel" aria-labelledby="panel-title" hidden>
            <div class="panel-head">
                <h2 id="panel-title"></h2>
                <button id="panel-close" class="icon-btn" type="button" data-i18n-aria="close_panel" data-i18n-title="close_panel"></button>
            </div>

            <nav id="toc-pane" class="pane" data-i18n-aria="contents" hidden>
                <ol id="toc" class="toc"></ol>
                <p id="toc-empty" class="empty" data-i18n="toc_empty" hidden></p>
            </nav>

            <div id="search-pane" class="pane" hidden>
                <form id="search-form" class="search-box" role="search">
                    <span id="search-icon" aria-hidden="true"></span>
                    <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search_placeholder" data-i18n-aria="search_placeholder">
                </form>
                <div id="search-progress" class="search-progress" hidden>
                    <div class="search-fill" id="search-fill"></div>
                </div>
                <p id="search-status" class="search-status" role="status"></p>
                <button id="search-back" class="tool strong back-btn" type="button" hidden></button>
                <ol id="results" class="results"></ol>
            </div>

            <div id="marks-pane" class="pane" hidden>
                <button id="mark-add" class="tool strong" type="button"></button>
                <p id="mark-reason" class="hint" hidden></p>
                <ol id="bookmarks" class="marks"></ol>
                <p id="marks-empty" class="empty" data-i18n="marks_empty" hidden></p>
            </div>

            <div id="hl-pane" class="pane" hidden>
                <div class="hl-tools">
                    <button id="hl-export-md" class="tool strong" type="button"></button>
                    <button id="hl-export-json" class="tool strong" type="button"></button>
                </div>
                <ol id="hl-list" class="marks hl-list"></ol>
                <p id="hl-empty" class="empty" data-i18n="hl_empty" hidden></p>
            </div>

            <div id="settings" class="pane" hidden>
                <div class="set-row">
                    <span class="set-label" id="lbl-size" data-i18n="text_size"></span>
                    <div class="stepper" role="group" aria-labelledby="lbl-size">
                        <button id="size-down" class="icon-btn" type="button" data-i18n-aria="smaller_text" data-i18n-title="smaller_text"></button>
                        <output id="size-val" aria-live="polite"></output>
                        <button id="size-up" class="icon-btn" type="button" data-i18n-aria="larger_text" data-i18n-title="larger_text"></button>
                    </div>
                </div>
                <div class="set-row col">
                    <span class="set-label" id="lbl-font" data-i18n="font"></span>
                    <div class="segmented wide" role="radiogroup" aria-labelledby="lbl-font" id="seg-font"></div>
                </div>
                <div class="set-row">
                    <span class="set-label" id="lbl-lh" data-i18n="line_spacing"></span>
                    <div class="slider-wrap">
                        <input type="range" id="slider-lh" min="1.1" max="2.4" step="0.05" value="1.4" aria-labelledby="lbl-lh">
                        <output id="lh-val" aria-live="polite">1.40</output>
                    </div>
                </div>
                <div class="set-row">
                    <span class="set-label" id="lbl-margin-v" data-i18n="margin_v"></span>
                    <div class="slider-wrap">
                        <input type="range" id="slider-margin-v" min="10" max="30" step="1" value="10" aria-labelledby="lbl-margin-v">
                        <output id="margin-v-val" aria-live="polite">10%</output>
                    </div>
                </div>
                <div class="set-row">
                    <span class="set-label" id="lbl-margin-h" data-i18n="margin_h"></span>
                    <div class="slider-wrap">
                        <input type="range" id="slider-margin-h" min="10" max="60" step="1" value="20" aria-labelledby="lbl-margin-h">
                        <output id="margin-h-val" aria-live="polite">20%</output>
                    </div>
                </div>
                <div class="set-row">
                    <span class="set-label" id="lbl-justify" data-i18n="justify"></span>
                    <div class="segmented" role="radiogroup" aria-labelledby="lbl-justify" id="seg-justify"></div>
                </div>
                <div class="set-row col" id="row-theme">
                    <span class="set-label" id="lbl-theme" data-i18n="theme"></span>
                    <div class="swatches" role="radiogroup" aria-labelledby="lbl-theme" id="seg-theme"></div>
                </div>
                <div class="set-row">
                    <span class="set-label" id="lbl-mode" data-i18n="layout"></span>
                    <div class="segmented" role="radiogroup" aria-labelledby="lbl-mode" id="seg-mode"></div>
                </div>
                <div class="set-row col" id="row-spread">
                    <span class="set-label" id="lbl-spread" data-i18n="pages_per_screen"></span>
                    <div class="segmented wide three" role="radiogroup" aria-labelledby="lbl-spread" id="seg-spread"></div>
                </div>
                <div class="set-row col" id="row-turn">
                    <span class="set-label" id="lbl-turn" data-i18n="page_turn"></span>
                    <div class="segmented wide three" role="radiogroup" aria-labelledby="lbl-turn" id="seg-turn"></div>
                </div>
                <div class="set-row">
                    <span class="set-label" id="lbl-own" data-i18n="book_only"></span>
                    <button id="own-style" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="lbl-own"></button>
                </div>
                <div class="set-row">
                    <button id="btn-keys" class="tool" type="button" data-i18n="keyboard_shortcuts"></button>
                </div>
            </div>
        </aside>
    </div>

    <dialog id="keys" class="keys" aria-labelledby="keys-title">
        <h2 id="keys-title" data-i18n="keyboard_shortcuts"></h2>
        <dl id="keys-list" class="keys-list"></dl>
        <button id="keys-close" class="tool strong" type="button" data-i18n="close_panel"></button>
    </dialog>

    <div id="veil" class="veil" hidden>
        <div class="veil-box"><span id="veil-icon" aria-hidden="true"></span><span data-i18n="drop_to_open"></span></div>
    </div>

    <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" aria-modal="true" hidden>
        <div class="loading-box">
            <span class="loading-spinner" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="34" height="34" fill="none">
                    <circle class="loading-track" cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2.6" />
                    <path class="loading-arc" d="M21.5 12a9.5 9.5 0 0 0-9.5-9.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
                </svg>
            </span>
            <span id="loading-text" class="loading-text"></span>
        </div>
    </div>

    <!-- WebApp Scripts: Service Worker & Sync -->
    <script>
        // 1. PWA Service Worker Registration (network check + reload when an updated SW takes over)
        if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
            const hadController = !!navigator.serviceWorker.controller;
            let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', async () => {
                if (hadController && !reloaded) {
                    reloaded = true;
                    try {
                        await window.__rp?.flush?.();
                    } catch {}
                    location.reload();
                }
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', {
                        updateViaCache: 'none'
                    })
                    .then((reg) => reg?.update?.())
                    .catch(() => {});
            });
        }

        // Notificar a la biblioteca para actualizar automáticamente al guardar un libro
        window.addEventListener('rp-book-saved', () => {
            window.dispatchEvent(new CustomEvent('rp-reload-library'));
        });
    </script>
</body>

</html>
