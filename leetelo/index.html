<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Léetelo</title>
    <link rel="manifest" href="app.webmanifest">
    <meta name="theme-color" content="#17181b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Léetelo">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <style>
        html, body { margin: 0; height: 100%; background: #17181b; color: #ACBAC3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: dark; }
        .splash-screen { position: fixed; inset: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); background: #17181b; color: #ACBAC3; }
        .splash-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
        .splash-logo { display: block; width: 88px; height: 88px; flex-shrink: 0; }
        .splash-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; color: #ACBAC3; }
        .splash-spinner { display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; color: #8997a0; }
        .splash-spinner svg { display: block; animation: rp-spin 0.85s linear infinite; }
        .splash-spinner .loading-track { opacity: 0.22; }
        .splash-version { position: absolute; left: 50%; bottom: max(28px, calc(18px + env(safe-area-inset-bottom, 0px))); transform: translateX(-50%); font-size: 12px; color: #8997a0; font-weight: 550; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
        @keyframes rp-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div id="splash-screen" class="splash-screen" aria-hidden="true">
        <div class="splash-inner">
            <svg class="splash-logo" viewBox="0 0 512 512" width="88" height="88" aria-hidden="true">
                <defs>
                    <linearGradient id="spBkCover" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4e592d"/><stop offset="100%" stop-color="#586434"/></linearGradient>
                    <linearGradient id="spBkLeafA" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#6b7a42"/><stop offset="100%" stop-color="#879857"/></linearGradient>
                    <linearGradient id="spBkLeafB" x1="0" y1="1" x2="0.8" y2="0"><stop offset="0%" stop-color="#7c8f4c"/><stop offset="100%" stop-color="#99ae64"/></linearGradient>
                    <linearGradient id="spBkLeafC" x1="0.2" y1="1" x2="0.8" y2="0"><stop offset="0%" stop-color="#8fa356"/><stop offset="100%" stop-color="#abc072"/></linearGradient>
                </defs>
                <path d="M36 184c66-8 148 22 216 206h8c68-184 150-214 216-206v212c-74-14-142 0-198 32-12 7-32 7-44 0-56-32-124-46-198-32V184Z" fill="url(#spBkCover)"/>
                <path d="M249 384C198 362 126 356 62 366V146c72 22 140 82 187 238Z" fill="url(#spBkLeafA)" opacity="0.88"/>
                <path d="M249 384C178 362 96 320 34 226c76 48 158 58 215 158Z" fill="url(#spBkLeafB)" opacity="0.72"/>
                <path d="M249 384C166 346 108 264 102 104c68 38 142 84 147 280Z" fill="url(#spBkLeafB)" opacity="0.72"/>
                <path d="M249 384C168 332 108 258 68 178c82 40 156 96 181 206Z" fill="url(#spBkLeafC)" opacity="0.58"/>
                <path d="M263 384c51-22 123-28 187-18V146c-72 22-140 82-187 238Z" fill="url(#spBkLeafA)" opacity="0.88"/>
                <path d="M263 384c71-22 153-64 215-158-76 48-158 58-215 158Z" fill="url(#spBkLeafB)" opacity="0.72"/>
                <path d="M263 384c83-38 141-120 147-280-68 38-142 84-147 280Z" fill="url(#spBkLeafB)" opacity="0.72"/>
                <path d="M263 384c81-52 141-126 181-206-82 40-156 96-181 206Z" fill="url(#spBkLeafC)" opacity="0.58"/>
            </svg>
            <div class="splash-title">Léetelo</div>
            <span class="splash-spinner" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                    <circle class="loading-track" cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2.4" />
                    <path class="loading-arc" d="M21.5 12a9.5 9.5 0 0 0-9.5-9.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                </svg>
            </span>
        </div>
        <div id="splash-version" class="splash-version"></div>
    </div>
    <script>
        const afterFirstPaint = () => new Promise((resolve) => {
            const done = (() => { let ran = false; return () => { if (!ran) { ran = true; resolve(); } }; })();
            if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => setTimeout(done, 0));
            setTimeout(done, 48);
        });

        const waitWorker = (worker) => new Promise((resolve) => {
            if (!worker || worker.state === 'activated' || worker.state === 'redundant') {
                resolve(worker?.state || 'none');
                return;
            }
            const timer = setTimeout(() => resolve(worker.state), 6500);
            worker.addEventListener('statechange', () => {
                if (worker.state === 'activated' || worker.state === 'redundant') {
                    clearTimeout(timer);
                    resolve(worker.state);
                }
            });
        });

        const checkSwAndPreload = async () => {
            const vs = document.createElement('script');
            vs.src = 'src/lib/version.js';
            vs.onload = () => {
                const sv = document.getElementById('splash-version');
                if (sv && window.APP_VERSION) sv.textContent = 'v ' + window.APP_VERSION;
            };
            document.head.appendChild(vs);

            const prewarm = Promise.allSettled([
                fetch('./leetelo.html'),
                fetch('./src/lib/base.css'),
                fetch('./src/reader/reader.css'),
                fetch('./src/reader/reader.js'),
            ]);

            if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
                try {
                    const hadController = !!navigator.serviceWorker.controller;
                    if (navigator.onLine !== false || !hadController) {
                        const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
                        if (reg && navigator.onLine !== false) {
                            let found = reg.installing || (hadController ? reg.waiting : null);
                            reg.addEventListener('updatefound', () => {
                                if (!found) found = reg.installing;
                            });
                            await Promise.race([reg.update().catch(() => {}), new Promise((r) => setTimeout(r, 1500))]);
                            const incoming = found || reg.installing || (hadController ? reg.waiting : null);
                            if (incoming) await waitWorker(incoming);
                        }
                    }
                    try { sessionStorage.setItem('rp_sw_checked', String(Date.now())); } catch {}
                } catch {}
            }

            await Promise.race([prewarm, new Promise((r) => setTimeout(r, 1200))]);
            location.replace('./leetelo.html' + location.search + location.hash);
        };

        afterFirstPaint().then(checkSwAndPreload);
    </script>
</body>

</html>
