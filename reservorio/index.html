            </span>
        </div>
        <div id="splash-version" class="splash-version"></div>
    </div>
    <script>
        const afterFirstPaint = () => new Promise((resolve) => {
            const done = (() => { let ran = false; return () => { if (!ran) { ran = true; resolve(); } }; })();
            if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => setTimeout(done, 0));
            setTimeout(done, 48);
        });

        const waitWorker = (worker) => new Promise((resolve) => {
            if (!worker || worker.state === 'activated' || worker.state === 'redundant') {
                resolve(worker?.state || 'none');
                return;
            }
            const timer = setTimeout(() => resolve(worker.state), 6500);
            worker.addEventListener('statechange', () => {
                if (worker.state === 'activated' || worker.state === 'redundant') {
                    clearTimeout(timer);
                    resolve(worker.state);
                }
            });
        });

        const checkSwAndPreload = async () => {
            const vs = document.createElement('script');
            vs.src = 'src/lib/version.js';
            vs.onload = () => {
                const sv = document.getElementById('splash-version');
                if (sv && window.APP_VERSION) sv.textContent = 'v ' + window.APP_VERSION;
            };
            document.head.appendChild(vs);

            const prewarm = Promise.allSettled([
                fetch('./reservorio.html'),
                fetch('./src/lib/base.css'),
                fetch('./src/reader/reader.css'),
                fetch('./src/reader/reader.js'),
            ]);

            if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
                try {
                    const hadController = !!navigator.serviceWorker.controller;
                    if (navigator.onLine !== false || !hadController) {
                        const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
                        if (reg && navigator.onLine !== false) {
                            let found = reg.installing || (hadController ? reg.waiting : null);
                            reg.addEventListener('updatefound', () => {
                                if (!found) found = reg.installing;
                            });
                            await Promise.race([reg.update().catch(() => {}), new Promise((r) => setTimeout(r, 1500))]);
                            const incoming = found || reg.installing || (hadController ? reg.waiting : null);
                            if (incoming) await waitWorker(incoming);
                        }
                    }
                    try { sessionStorage.setItem('rp_sw_checked', String(Date.now())); } catch {}
                } catch {}
            }

            await Promise.race([prewarm, new Promise((r) => setTimeout(r, 1200))]);
            location.replace('./reservorio.html' + location.search + location.hash);
        };

        afterFirstPaint().then(checkSwAndPreload);
    </script>
</body>

</html>
