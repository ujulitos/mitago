    <!-- Splashscreen siempre en Crepúsculo desde frame 0 -->
    <script>
        document.documentElement.style.colorScheme = 'dark';
        window.__rpStylesReady = new Promise((resolve) => {
            window.__rpCssDone = ((n) => () => { if (--n <= 0) resolve(); })(2);
        });
    </script>
    <style>
        [hidden] { display: none !important; }
        html, body { margin: 0; background: #17181b; color: #ACBAC3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .splash-screen { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); background: #17181b; color: #ACBAC3; opacity: 1; }
        .splash-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
        .splash-logo { display: block; width: 88px; height: 88px; flex-shrink: 0; }
        .splash-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; color: #ACBAC3; }
        .splash-spinner { display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; color: #8997a0; }
        .splash-spinner svg { display: block; animation: rp-spin 0.85s linear infinite; }
        .splash-spinner .loading-track { opacity: 0.22; }
        .splash-version { position: absolute; left: 50%; bottom: max(28px, calc(18px + env(safe-area-inset-bottom, 0px))); transform: translateX(-50%); font-size: 12px; color: #8997a0; font-weight: 550; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
        @keyframes rp-spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Deferred stylesheets inside noscript fallback (JS injects after splash Frame 0 paint) -->
    <noscript>

    <!-- WebApp Scripts: Service Worker & Sync -->
    <script>
        // 1. PWA Service Worker Registration (startup update check behind splash screen)
        window.__rpUpdating = false;
        if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
            const hadController = !!navigator.serviceWorker.controller;
            let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', async () => {
                if (hadController && !reloaded) {
                    reloaded = true;
                    window.__rpUpdating = true;
                    try {
                        await window.__rp?.flush?.();
                    } catch {}
                    location.reload();
                }
            });
            const waitWorker = (worker) => new Promise((resolve) => {
                if (!worker || worker.state === 'activated' || worker.state === 'redundant') {
                    resolve(worker?.state || 'none');
                    return;
                }
                const done = (state) => resolve(state);
                const timer = setTimeout(() => done(worker.state), 6500);
                worker.addEventListener('statechange', () => {
                    if (worker.state === 'activated' || worker.state === 'redundant') {
                        clearTimeout(timer);
                        done(worker.state);
                    }
                });
            });
            const checkUpdates = async () => {
                try {
                    const reg = await navigator.serviceWorker.register('./sw.js', {
                        updateViaCache: 'none'
                    });
                    if (!reg) return;
                    let found = reg.installing || (hadController ? reg.waiting : null);
                    reg.addEventListener('updatefound', () => {
                        if (!found) found = reg.installing;
                    });
                    if (navigator.onLine !== false) {
                        await Promise.race([
                            reg.update().catch(() => {}),
                            new Promise((r) => setTimeout(r, 1500))
                        ]);
                    }
                    const incoming = found || reg.installing || (hadController ? reg.waiting : null);
                    if (incoming && hadController) {
                        window.__rpUpdating = true;
                        const state = await waitWorker(incoming);
                        if (state === 'redundant') {
                            window.__rpUpdating = false;
                            return;
                        }
                        await new Promise((r) => setTimeout(r, 1000));
                        if (!reloaded) window.__rpUpdating = false;
                    }
                } catch {
                    window.__rpUpdating = false;
                }
            };
            const startSwCheck = () => {
                let checkedRecently = false;
                try {
                    const ts = Number(sessionStorage.getItem('rp_sw_checked') || 0);
                    sessionStorage.removeItem('rp_sw_checked');
                    checkedRecently = ts > 0 && (Date.now() - ts) < 10000;
                } catch {}
                if (checkedRecently) {
                    window.__rpSwCheck = Promise.resolve();
                    return;
                }
                if (navigator.onLine !== false || !hadController) {
                    window.__rpSwCheck = checkUpdates();
                } else {
                    window.__rpSwCheck = Promise.resolve();
                    window.addEventListener('online', () => {
                        checkUpdates();
                    }, { once: true });
                }
            };
            window.__rpStartSwCheck = startSwCheck;
        } else {
            window.__rpSwCheck = Promise.resolve();
        }

        // Paint splash Frame 0 first, then load stylesheets, SW update check & reader.js
        const afterSplashPaint = () => new Promise((resolve) => {
            const done = (() => { let ran = false; return () => { if (!ran) { ran = true; resolve(); } }; })();
            if (typeof requestAnimationFrame === 'function') {
                requestAnimationFrame(() => setTimeout(done, 0));
            }
            setTimeout(done, 48);
        });
        const injectCss = (href, track) => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            if (track) {
                link.onload = () => window.__rpCssDone?.();
                link.onerror = () => window.__rpCssDone?.();
            }
            document.head.appendChild(link);
        };
        afterSplashPaint().then(() => {
            injectCss('src/lib/fonts.css', false);
            injectCss('src/lib/base.css', true);
            injectCss('src/reader/reader.css', true);
            const vs = document.createElement('script');
            vs.src = 'src/lib/version.js';
            vs.onload = fillSplashVersion;
            document.head.appendChild(vs);
            window.__rpStartSwCheck?.();
            import('./src/reader/reader.js');
        });

        // Notificar a la biblioteca para actualizar automáticamente al guardar un libro
        window.addEventListener('rp-book-saved', () => {
            window.dispatchEvent(new CustomEvent('rp-reload-library'));
        });
    </script>
